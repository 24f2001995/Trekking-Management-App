{% extends "base_admin.html" %}

{% block title %}Edit Trek{% endblock %}

{% block content %}

<h1>Edit Trek</h1>

<div class="card">

    <form method="POST">

        <label>Trek Name</label>
        <input type="text" name="name" value="{{ trek.name }}" required>

        <label>Location</label>
        <input type="text" name="location" value="{{ trek.location }}" required>

        <label>Difficulty</label>
        <select name="difficulty">
            <option value="Easy" {% if trek.difficulty == "Easy" %}selected{% endif %}>Easy</option>
            <option value="Moderate" {% if trek.difficulty == "Moderate" %}selected{% endif %}>Moderate</option>
            <option value="Hard" {% if trek.difficulty == "Hard" %}selected{% endif %}>Hard</option>
        </select>

        <label>Duration (Days)</label>
        <input type="number" name="duration" value="{{ trek.duration }}" required>

        <label>Start Date</label>
        <input type="date" name="start_date" value="{{ trek.start_date }}" required>

        <label>End Date</label>
        <input type="date" name="end_date" value="{{ trek.end_date }}" required>

        <label>Available Slots</label>
        <input type="number" name="available_slots" value="{{ trek.available_slots }}" required>

        <label>Status</label>

        <select name="status">
            <option value="Open" {% if trek.status=="Open" %}selected{% endif %}>Open</option>
            <option value="Closed" {% if trek.status=="Closed" %}selected{% endif %}>Closed</option>
            <option value="Started" {% if trek.status=="Started" %}selected{% endif %}>Started</option>
            <option value="Ongoing" {% if trek.status=="Ongoing" %}selected{% endif %}>Ongoing</option>
            <option value="Completed" {% if trek.status=="Completed" %}selected{% endif %}>Completed</option>
        </select>

        <br>

        <button type="submit" class="btn">Update Trek</button>

    </form>

</div>

{% endblock %}

<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

    <h2>Login</h2>

    <form method="POST" autocomplete="on">
        <label>Email:</label>
        <input
        type="email"
        name="email"
        autocomplete="email"
        required>
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>
        <br><br>

        <button type="submit">Login</button>
    </form>

    <p>
        New user? <a href="/register">Register here</a>
    </p>

</body>
</html>

{% extends "base_staff.html" %}

{% block title %}Staff Profile{% endblock %}

{% block content %}

<h1>Update Staff Profile</h1>

<div class="card">

    <form method="POST">

        <label>Name</label>
        <input type="text" name="name" value="{{ staff.name }}" required>

        <label>Email</label>
        <input type="email" value="{{ staff.email }}" readonly>

        <label>Phone</label>
        <input type="text" name="phone" value="{{ staff.phone }}">

        <label>Password</label>
        <input type="text" name="password" value="{{ staff.password }}" required>

        <br>

        <button type="submit" class="btn">Update Profile</button>

    </form>

</div>

{% endblock %}
